name: Rust CI

on:
  pull_request:
  push:
    branches: [main, audit-fixes]

permissions:
  contents: read

jobs:
  test:
    name: Format, lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libudev-dev libinput-dev libseat-dev libdisplay-info-dev \
            libgbm-dev libegl1-mesa-dev libvulkan-dev \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxinerama-dev libdbus-1-dev libsystemd-dev \
            libgtk-3-dev libglib2.0-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format and validate Rust source
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release
