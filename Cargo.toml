[package]
name = "cosmic-samba"
version = "0.1.0"
edition = "2024"
description = "Cosmic desktop application to manage a Samba server and shares"
license = "MIT"
authors = ["Rustam"]

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", features = ["about", "wgpu", "tokio", "xdg-portal"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
